name: Update Google Scholar stats

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install scholarly==1.7.11 pyyaml

      - env:
          SCHOLAR_ID: ZwY-zMgAAAAJ
        run: python scripts/fetch_scholar.py

      - run: |
          if [[ -n "$(git status --porcelain _data/scholar.yml)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/scholar.yml
            git commit -m "Update Scholar stats"
            git push
          else
            echo "No changes."
          fi
